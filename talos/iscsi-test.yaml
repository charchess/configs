apiVersion: v1
kind: Namespace
metadata:
  name: iscsi-debug
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: iscsi-debug
  namespace: iscsi-debug
spec:
  selector:
    matchLabels: { app: iscsi-debug }
  template:
    metadata:
      labels: { app: iscsi-debug }
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: debug
        image: alpine:latest
        command: ["/bin/sh", "-c", "sleep infinity"]
        securityContext:
          privileged: true
        volumeMounts:
        - name: modules
          mountPath: /lib/modules
        - name: dev
          mountPath: /dev
      volumes:
      - name: modules
        hostPath: { path: /lib/modules }
      - name: dev
        hostPath: { path: /dev }
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"




