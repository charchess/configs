apiVersion: ceph.rook.io/v1
kind: CephCluster
metadata:
  name: rook-ceph
  namespace: rook-ceph
spec:
  cephVersion:
    image: ceph/ceph:v18
  mon:
    count: 3
    allowMultiplePerNode: false
  storage:
    useAllNodes: false
    nodes:
      - name: jade
        devices:
          - name: "sdb"
      - name: emy
        devices:
          - name: "sdb"
      - name: ruby
        devices:
          - name: "sdb"
  placement:
    all:
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: Exists
          effect: NoSchedule