# vixens-jade.yaml
machine:
  type: controlplane
  certSANs: ["192.168.111.63", "192.168.200.63"]
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.30.0
    clusterDNS: ["10.96.0.10"]
    nodeIP:
      validSubnets: ["192.168.111.0/24", "192.168.200.0/24"]
  network:
    hostname: jade
    interfaces:
      - interface: enp2s0
        vlans:
          - vlanId: 200
            dhcp: false
            addresses: ["192.168.200.63/24"]
            routes:
              - network: 0.0.0.0/0
                gateway: 192.168.200.1
          - vlanId: 111
            dhcp: false
            addresses: ["192.168.111.63/24"]
            vip:
              ip: 192.168.111.60
  install:
    disk: /dev/nvme0n1
    image: ghcr.io/siderolabs/installer:v1.7.5

  files:
    - op: create
      path: /var/etc/iscsi/initiatorname.iscsi
      permissions: 0o600
      content: |
        InitiatorName=iqn.2017-11.dev.talos:494e9791d5f66a852806d70ea21a82de-test

