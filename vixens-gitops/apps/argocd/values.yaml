# ======================================================================
# Contenu à placer dans votre values.yaml pour ArgoCD
# ======================================================================
# Ce bloc va surcharger les permissions RBAC par défaut du chart
# et donner au serveur ArgoCD les droits nécessaires pour fonctionner.

server:
  # On s'assure que le chart a bien le droit de créer les règles RBAC
  rbac:
    create: true

  # On définit explicitement les règles complètes pour le ClusterRole du serveur
  clusterRoleRules:
    # Règle principale donnant un accès complet pour gérer les ressources
    - apiGroups:
        - "*"
      resources:
        - "*"
      verbs:
        - get
        - list    # <-- PERMISSION QUI MANQUAIT
        - watch   # <-- PERMISSION QUI MANQUAIT
        - patch
        - delete
        - update
        - create
    
    # Règles additionnelles pour des actions spécifiques (logs, events, etc.)
    - apiGroups:
        - ""
      resources:
        - events
      verbs:
        - create
        - list
    - apiGroups:
        - ""
      resources:
        - pods
        - pods/log
      verbs:
        - get
    - apiGroups:
        - argoproj.io
      resources:
        - applications
        - applicationsets
      verbs:
        - get
        - list
        - update
        - watch
    - apiGroups:
        - batch
      resources:
        - jobs
      verbs:
        - create
    - apiGroups:
        - argoproj.io
      resources:
        - workflows
      verbs:
        - create
