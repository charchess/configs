apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Helm chart (official)
    - repoURL: https://argoproj.github.io/argo-helm  # ← fix
      chart: argo-cd
      targetRevision: 7.7.6
      helm:
        valueFiles:
          - $values/vixens-gitops/apps/argocd/helm-values.yaml
    # Extra manifests (IngressRoute, etc.)
    - repoURL: https://github.com/charchess/configs.git
      targetRevision: gitops
      path: vixens-gitops/apps/argocd/manifests
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false   # ← never prune yourself
      selfHeal: true
    syncOptions:
      - CreateNamespace=true