# application.yaml - Basé sur la doc officielle
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.6.0  # Version stable
    helm:
      values: |
        # Configuration Talos OS officielle
        global:
          cattle:
            systemDefaultRegistry: ""
        
        # Settings optimisés pour Talos
        defaultSettings:
          createDefaultDiskLabeledNodes: true
          defaultDataPath: /var/lib/longhorn
          replicaSoftAntiAffinity: false
          storageOverProvisioningPercentage: 200
          storageMinimalAvailablePercentage: 25
          defaultReplicaCount: 2  # Pour 3 nœuds
          defaultLonghornStaticStorageClass: longhorn
        
        # Configuration CSI
        persistence:
          defaultClass: true
          defaultClassReplicaCount: 2
        
        # Désactiver les hooks problématiques
        preUpgradeChecker:
          enabled: false
        
        # Managers avec tolérations Talos
        longhornManager:
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "node-role.kubernetes.io/master"
              operator: "Exists"
              effect: "NoSchedule"
          securityContext:
            privileged: true
        
        longhornDriver:
          tolerations:
            - key: "node-role.kubernetes.io/control-plane"
              operator: "Exists"
              effect: "NoSchedule"
            - key: "node-role.kubernetes.io/master"
              operator: "Exists"
              effect: "NoSchedule"
          securityContext:
            privileged: true
        
        # UI accessible
        ingress:
          enabled: false
        service:
          ui:
            type: ClusterIP
        
        # Réduction des replicas pour petit cluster
        csi:
          attacherReplicaCount: 2
          provisionerReplicaCount: 2
          resizerReplicaCount: 2
          snapshotterReplicaCount: 2
        
        webhook:
          replicas: 2
        
        # SecurityContext
        longhornManager:
          securityContext:
            privileged: true
        longhornDriver:
          securityContext:
            privileged: true
        
        # NetworkPolicy (facultatif)
        networkPolicies:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
      
      