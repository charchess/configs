# vixens-gitops/apps/longhorn/application.yaml
# --- application.yaml : On passe en mode "directory" pour tout déployer ---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    # La source est maintenant le répertoire. ArgoCD va scanner ce dossier
    # et appliquer TOUS les .yaml qu'il trouve (notre ingress.yaml)
    # ET il va aussi détecter et rendre le chart Helm.
    repoURL: https://github.com/charchess/configs.git
    targetRevision: gitops
    path: vixens-gitops/apps/longhorn

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true