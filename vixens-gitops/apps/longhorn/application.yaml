# --- Contenu FINAL et DÉFINITIF pour : vixens-gitops/apps/longhorn/application.yaml ---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argopd
spec:
  project: default
  # On utilise le champ "sources" (au pluriel)
  sources:
    # Source N°1 : Le chart Helm distant
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.9.1
      helm:
        # Pointeur vers le fichier de valeurs dans la source nommée 'values'
        valueFiles:
          - $values/values.yaml

    # Source N°2 : Notre dépôt Git, qui fournit les manifestes manuels ET les fichiers de valeurs
    - repoURL: https://github.com/charchess/configs.git
      targetRevision: gitops
      # --- LA CORRECTION EST ICI ---
      # On spécifie le chemin où trouver nos manifestes manuels (ingress.yaml) et nos valeurs
      path: vixens-gitops/apps/longhorn
      # On nomme cette source pour la référence $values
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true # On garde cette option pour plus de robustesse
      
      