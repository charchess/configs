apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  # On utilise le champ "sources" (au pluriel)
  sources:
    # Source N°1 : Le chart Helm distant
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.9.1
      helm:
        # Pointeur vers le fichier de valeurs dans la deuxième source
        valueFiles:
          - $values/values.yaml

    # Source N°2 : Notre dépôt Git qui fournit les fichiers de valeurs et les manifestes manuels
    - repoURL: https://github.com/charchess/configs.git
      targetRevision: gitops
      # On ne spécifie pas de 'path' ici car valueFiles est absolu
      # On nomme cette source "values" pour la référence ci-dessus
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true # On garde cette option pour plus de robustesse