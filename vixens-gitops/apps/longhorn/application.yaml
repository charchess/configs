# vixens-gitops/apps/longhorn/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  sources:
    # Chart distant
    - repoURL: https://charts.longhorn.io
      chart: longhorn
      targetRevision: 1.9.1
      helm:
        valueFiles:
          - $values/vixens-gitops/apps/longhorn/values.yaml
        skipCrds: false
    # Dépôt Git contenant values.yaml + resources.yaml
    - repoURL: https://github.com/charchess/configs.git
      targetRevision: gitops
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true