# vixens-gitops/apps/longhorn/application.yaml
# --- Contenu final pour : vixens-gitops/apps/longhorn/application.yaml ---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    # La source principale est notre dépôt Git
    repoURL: https://github.com/charchess/configs.git
    targetRevision: gitops
    path: vixens-gitops/apps/longhorn

    # Dans cette source, on spécifie le chart distant à utiliser
    helm:
      chart: longhorn
      repoURL: https://charts.longhorn.io
      targetRevision: "1.9.1" # ou la version que vous souhaitez
      
      # Et le fichier de valeurs local à appliquer
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true