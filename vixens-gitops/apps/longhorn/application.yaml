# vixens-gitops/apps/longhorn/application.yaml (Version finale avec noHooks)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    # La source principale est notre dépôt Git
    repoURL: https://github.com/charchess/configs.git
    targetRevision: gitops
    path: vixens-gitops/apps/longhorn

    helm:
      # Info sur le chart distant
      chart: longhorn
      repoURL: https://charts.longhorn.io
      targetRevision: "1.9.1"
      
      # Le fichier de valeurs local à appliquer
      valueFiles:
        - values.yaml

      # --- LA SOLUTION FINALE ---
      # Dit à ArgoCD d'ignorer tous les hooks (comme pre-upgrade)
      # lors de la génération des manifestes.
      noHooks: true

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true