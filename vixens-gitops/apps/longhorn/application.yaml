# vixens-gitops/apps/longhorn/application.yaml (CORRIGÉ ET FINAL)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    # On définit d'abord la source du chart Helm distant
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: "1.9.1" # Version à jour du chart

    # Ensuite, on spécifie que les fichiers de valeurs
    # proviennent d'une source différente (notre dépôt Git).
    helm:
      valueFiles:
        # ArgoCD va chercher ce fichier dans le dépôt Git spécifié ci-dessous
#        - $values/vixens-gitops/apps/longhorn/values.yaml
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true