# --- Contenu pour : vixens-gitops/apps/longhorn/ingress.yaml ---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ingress
  namespace: longhorn-system
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-gandi-prod"
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure   # HTTPS
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - hubble.truxonline.com
      secretName: hubble-truxonline-tls
  rules:
  - host: longhorn.truxonline.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: longhorn-frontend
            port:
              number: 80


