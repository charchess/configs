# --- values.yaml : RESTAURÉ ET CORRIGÉ ---

# Configuration de l'Ingress que nous avons validée
ingress:
  enabled: false

# Désactivation du hook problématique via la méthode native du chart
# (comme dans votre version originale)
preUpgradeChecker:
  jobEnabled: false

# Tolérances explicites pour chaque composant, car le chart
# ignore une configuration globale. C'est la clé de la solution.
longhornManager:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
longhornDriver:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
longhornUI:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
# Par sécurité, nous laissons aussi la section globale au cas où de nouveaux
# composants du chart en auraient besoin.
global:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
      
      