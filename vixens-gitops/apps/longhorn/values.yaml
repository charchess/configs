# --- Contenu pour : vixens-gitops/apps/longhorn/values.yaml ---

# On dit au chart de NE PAS créer d'Ingress, car nous le gérons nous-mêmes
ingress:
  enabled: false

# Tolérances explicites pour chaque composant
longhornManager:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
      
longhornDriver:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
longhornUI:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
global:
  tolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
      
# Tolerations appliquées à tous les composants système (managers, engine-image, etc.)
defaultSettings:
  systemManagedComponentsNodeSelector:
    kubernetes.io/os: linux
  systemManagedComponentsTolerations:
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
      
