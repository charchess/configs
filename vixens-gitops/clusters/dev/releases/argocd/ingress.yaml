apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server-https
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`argocd.truxonline.com`)
      kind: Rule
      services:
        - name: argocd-server
          port: 80
  tls:
    certResolver: le
    